{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}<div class="narrow-page"><div class="panel confirmation"><div class="warning-icon"><i class="bi bi-trash3"></i></div><h1>Delete {{ object_type }}?</h1><p>Are you sure you want to delete <strong>{{ object }}</strong>? This action can’t be undone.</p><form method="post">{% csrf_token %}<a class="btn btn-secondary" href="javascript:history.back()">Cancel</a><button class="btn btn-danger" type="submit">Yes, delete</button></form></div></div>{% endblock %}
